<mat-toolbar color="primary">
  @if (!displaySearchControl) {
    <h1>{{ title() }}</h1>
  }
  <span class="horizontal-spacer"></span>
  @if (displaySearchButton()) {
    <mat-icon
      (click)="switchSearchControl()"
      class="search-icon cursor-pointer mr-1"
      data-testid="toolbar-search-toggle"
      aria-hidden="false"
      aria-label="Search">search
    </mat-icon>
  }
  @if (displaySearchControl) {
    <div class="w-100 d-flex">
      <mat-form-field class="w-50 form-field__transparent">
        <input #search
               matInput
               data-testid="toolbar-search"
               type="search"
               autocomplete="off"
               [formControl]="searchFormControl">
      </mat-form-field>
    </div>
  }

  @if (userId) {
    <button mat-icon-button
            data-testid="toolbar-menu"
            [matMenuTriggerFor]="menu"
            aria-label="Example icon-button with a menu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item data-testid="toolbar-logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
      <button mat-menu-item data-testid="toolbar-create" (click)="goToCreate()">
        <mat-icon>add_circle</mat-icon>
        <span>Crear receta</span>
      </button>
      <button mat-menu-item data-testid="toolbar-my-recipes" (click)="goToPrivateList()">
        <mat-icon>view_list</mat-icon>
        <span>Mis recetas</span>
      </button>
      <button mat-menu-item data-testid="toolbar-all-recipes" (click)="goToPublicList()">
        <mat-icon>list</mat-icon>
        <span>Ver todas las recetas</span>
      </button>
    </mat-menu>
  } @else {
    <button mat-icon-button
            data-testid="toolbar-login"
            (click)="goToLogin()"
            title="Login"
            aria-label="Ir a la página de inicio de sesión">
      <mat-icon>login</mat-icon>
    </button>
  }

  @if (!userId && displayListButton()) {
    <button mat-icon-button
            data-testid="toolbar-list-icon"
            (click)="goToPublicList()"
            title="Ver todas las recetas">
      <mat-icon>list</mat-icon>
    </button>
  }
</mat-toolbar>
