# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: node server.js
      env:
        FIREBASE_DETAILS: ${{ secrets.FIREBASE_DETAILS }}
        FIREBASE_DETAILS_TEST: ${{ secrets.FIREBASE_DETAILS_TEST }}
    - run: yarn install --frozen-lockfile
    - run: yarn build
    - run: yarn test

    # --- e2e (issue #56, plan §4.7) -------------------------------------------
    # Playwright drives the local Firebase emulators (auth/firestore/storage) started by
    # `yarn e2e` itself; Java ships with ubuntu-latest, so only the browser is missing.
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright browser
      run: yarn playwright install --with-deps chromium
    - name: Run e2e tests
      run: yarn e2e
    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
        if-no-files-found: ignore
